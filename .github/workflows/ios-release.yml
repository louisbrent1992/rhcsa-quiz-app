# Builds a signed, App Store-ready IPA on a macOS runner and optionally
# ships it to TestFlight.
#
# Signing uses an App Store Connect API key rather than a .p12 + profile:
# Xcode creates and renews the provisioning profile itself via
# -allowProvisioningUpdates, so there is nothing to rotate when a certificate
# would otherwise expire.
#
# Required repository secrets:
#   APPLE_TEAM_ID                 10-character Team ID (Apple Developer →
#                                 Membership details)
#   APP_STORE_CONNECT_KEY_ID      Key ID of the API key
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown above the key list
#   APP_STORE_CONNECT_PRIVATE_KEY Full contents of the AuthKey_*.p8 file,
#                                 including the BEGIN/END lines
#
# The key needs the App Manager role to create profiles and upload builds.
#
#   gh workflow run ios-release.yml --ref main
#   gh workflow run ios-release.yml --ref main -f upload=true   # + TestFlight
name: iOS release (signed)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to TestFlight
        type: boolean
        default: false

jobs:
  build:
    name: Build signed IPA
    runs-on: macos-15
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Check required secrets
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

          # Shape checks. These values are all non-secret identifiers whose
          # formats differ, so a swap between them is catchable up front --
          # Apple only ever answers a mismatch with an opaque 401.
          echo "APPLE_TEAM_ID    length ${#TEAM_ID}   (expect 10)"
          echo "KEY_ID           length ${#KEY_ID}   (expect 10)"
          echo "ISSUER_ID        length ${#ISSUER_ID}   (expect 36, a UUID)"

          echo "$ISSUER_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' \
            || { echo "::error::APP_STORE_CONNECT_ISSUER_ID is not a UUID. It is the 'Issuer ID' shown above the key table on App Store Connect > Users and Access > Integrations -- not the Team ID."; exit 1; }
          # Accept the whole filename ("AuthKey_ABCDE12345.p8") as well as the
          # bare ID: xcodebuild needs the bare one, and the two are easy to
          # confuse because the ID is embedded in the filename.
          normalised="${KEY_ID%.p8}"
          normalised="${normalised#AuthKey_}"
          if [ "$normalised" != "$KEY_ID" ]; then
            echo "::add-mask::$normalised"
            echo "note: stripped AuthKey_/.p8 wrapping from APP_STORE_CONNECT_KEY_ID"
            echo "KEY_ID=$normalised" >> "$GITHUB_ENV"
            KEY_ID="$normalised"
          fi

          echo "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' \
            || { echo "::error::APP_STORE_CONNECT_KEY_ID should be the 10-character Key ID that also appears in the AuthKey_<KEY_ID>.p8 filename."; exit 1; }
          if [ "$KEY_ID" = "$TEAM_ID" ]; then
            echo "::warning::APPLE_TEAM_ID holds the same value as the Key ID. The next step asks Apple for the real Team ID."
          fi

      # xcodebuild looks for the key by name in ~/private_keys. CryptoKit's PEM
      # parser is strict: a stray CR or a missing trailing newline is enough
      # for "invalidPEMDocument", so normalise before writing.
      - name: Install App Store Connect API key
        run: |
          key="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > "$key"
          chmod 600 "$key"

          # Diagnostics only -- shape of the key, never its contents.
          echo "lines:        $(wc -l < "$key" | tr -d ' ')"
          echo "first line:   $(head -1 "$key")"
          echo "last line:    $(tail -1 "$key")"
          echo "body chars:   $(sed '1d;$d' "$key" | tr -d '\n' | wc -c | tr -d ' ')"

          hint="Set the secret from the file so newlines survive:  gh secret set APP_STORE_CONNECT_PRIVATE_KEY --repo \$GITHUB_REPOSITORY < AuthKey_${KEY_ID}.p8  -- pasting a multi-line key into an interactive prompt stores only its first line."

          head -1 "$key" | grep -q -- "-----BEGIN PRIVATE KEY-----" \
            || { echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not start with -----BEGIN PRIVATE KEY-----. $hint"; exit 1; }
          tail -1 "$key" | grep -q -- "-----END PRIVATE KEY-----" \
            || { echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is truncated: no -----END PRIVATE KEY----- line. $hint"; exit 1; }

          # Tolerate a key whose base64 body arrived on one line: rebuild the
          # PEM with the 64-column wrapping CryptoKit expects.
          if [ "$(grep -c '' "$key")" -le 3 ]; then
            body=$(sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' "$key" \
                   | tr -d ' \t\n\r')
            { echo "-----BEGIN PRIVATE KEY-----"
              echo "$body" | fold -w 64
              echo "-----END PRIVATE KEY-----"; } > "$key.wrapped"
            mv "$key.wrapped" "$key"
            chmod 600 "$key"
            echo "rewrapped single-line key body to $(grep -c '' "$key") lines"
          fi
          openssl pkey -in "$key" -noout \
            || { echo "::error::The key is not a valid PKCS#8 private key. Re-download or re-copy the .p8 from App Store Connect."; exit 1; }
          echo "openssl: key parses as a valid PKCS#8 private key"

      # Ask App Store Connect directly before spending four minutes on a build
      # that will fail: Xcode reports key problems only as an opaque 401 from
      # listTeams.action, while the API returns the actual reason.
      - name: Verify API key against App Store Connect
        run: |
          # A venv, because the runner's Homebrew python refuses global installs
          # with "externally-managed-environment".
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/ascvenv/bin/python" - <<'PY'
          import json, os, time, urllib.error, urllib.request
          import jwt

          key_id, issuer = os.environ["KEY_ID"], os.environ["ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")).read()
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/apps?limit=200",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              body = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              detail = e.read().decode()[:1000]
              print(f"::error::App Store Connect rejected the API key (HTTP {e.code}). {detail}")
              if e.code == 401:
                  print("::error::A 401 means the Key ID, the Issuer ID, or the .p8 do not belong together, or the key was revoked. Check APP_STORE_CONNECT_KEY_ID matches the AuthKey_<ID>.p8 filename and APP_STORE_CONNECT_ISSUER_ID is the UUID at the top of the Integrations page.")
              if e.code == 403:
                  print("::error::A 403 means the key authenticated but lacks the role. It needs App Manager or Admin to create profiles and upload builds.")
              raise SystemExit(1)

          apps = body.get("data", [])
          print(f"API key accepted. {len(apps)} app record(s) visible:")
          for a in apps:
              print("  -", a["attributes"].get("bundleId"))
          if not any(a["attributes"].get("bundleId") == "com.app.rhcsa-quiz" for a in apps):
              print("::warning::No app record for com.app.rhcsa-quiz yet. The archive can still create the bundle ID, but a TestFlight upload needs the record to exist.")

          # A bundle ID record carries seedId, which IS the Team ID. Use it to
          # confirm or correct APPLE_TEAM_ID: the Team ID and the Key ID are
          # both 10 characters, so a swap is invisible until signing fails.
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              bundles = json.load(urllib.request.urlopen(req)).get("data", [])
          except urllib.error.HTTPError as e:
              print(f"::warning::Could not list bundle IDs (HTTP {e.code}); leaving APPLE_TEAM_ID as given.")
              bundles = []

          seeds = {b["attributes"].get("seedId") for b in bundles if b["attributes"].get("seedId")}
          print(f"registered bundle IDs: {len(bundles)}, team IDs seen: {sorted(seeds) or 'none'}")
          for b in bundles:
              print("  *", b["attributes"].get("identifier"), "->", b["attributes"].get("seedId"))

          team = os.environ["TEAM_ID"]
          if seeds and team not in seeds:
              if len(seeds) == 1:
                  real = seeds.pop()
                  print(f"::warning::APPLE_TEAM_ID is wrong. Apple reports this account's Team ID as {real}; using it for this build. Update the secret: gh secret set APPLE_TEAM_ID")
                  with open(os.environ["GITHUB_ENV"], "a") as fh:
                      fh.write(f"TEAM_ID={real}\n")
              else:
                  print(f"::error::APPLE_TEAM_ID is not one of this account's team IDs {sorted(seeds)}; set it to the right one.")
                  raise SystemExit(1)
          elif seeds:
              print("APPLE_TEAM_ID matches Apple's records.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # A full unsigned build first: it writes Generated.xcconfig and resolves
      # the plugins the archive needs. There is no Podfile and no pod install
      # here -- Flutter integrates this project's plugins through Swift
      # Package Manager, so CocoaPods is not in the picture at all.
      #
      # --no-codesign is required even though the archive IS signed: the
      # keychain is still empty here, and Flutter aborts up front on "no valid
      # code signing certificates". Signing happens in the archive step, where
      # the API key lets Xcode mint the certificate and profile via
      # cloud-managed signing.
      - name: Prepare Xcode project
        run: flutter build ios --release --no-codesign

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -lh build/ios/ipa

      - name: Verify signature
        run: |
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          work="$RUNNER_TEMP/verify"
          rm -rf "$work" && mkdir -p "$work"
          unzip -q "$ipa" -d "$work"
          app=$(ls -d "$work"/Payload/*.app | head -1)
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
          codesign --verify --deep --strict "$app" && echo "signature verifies"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
